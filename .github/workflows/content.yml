name: Export and check Boji Club

on:
  workflow_dispatch:
  issues:
    types: [opened, edited, labeled, unlabeled, closed, reopened, deleted, transferred]
  push:
    paths-ignore:
      - "content/**"
      - "docs/**"
      - "README.md"
      - "AGENTS.md"

permissions: {}
concurrency:
  group: content-${{ github.ref }}
  cancel-in-progress: false

jobs:
  content:
    if: github.event_name != 'issues' || contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.20"
          enable-cache: false
      - name: Export published Issues
        id: export
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate --slurp -H "Cache-Control: no-cache" \
            "repos/${GITHUB_REPOSITORY}/issues?state=all&per_page=100" > "${RUNNER_TEMP}/issues.json"
          status=0
          uvx --python 3.14 escaping-site@0.6.0 export --config config.yaml --output content \
            --issues-json "${RUNNER_TEMP}/issues.json" || status=$?
          if [ "$status" -eq 2 ]; then exit 0; fi
          exit "$status"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build
      - name: Commit checked content
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then exit 0; fi
          git add --all content
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "content: update from Issues"
          git pull --rebase origin main
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main
      - name: Report skipped Issues
        env:
          SKIPPED: ${{ steps.export.outputs.skipped-issues }}
        run: |
          if [ -z "$SKIPPED" ]; then exit 0; fi
          echo "::error::Issues $SKIPPED were skipped; inspect the export summary."
          exit 1
